name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint (clippy, warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build CLI (for self-gate)
        run: cargo build -p polyforge-cli

      - name: PolyForge self-gate
        uses: tensorov/polyforge-action@v1
        with:
          task-id: bootstrap
          required: verified

  coverage:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (llvm-tools-preview)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Coverage floor (>= 80% lines, per-file >= 80%)
        run: cargo llvm-cov -p polyforge-core -p polyforge-toolrunner --all-features --fail-under-lines 80 --fail-under-file-lines 80

  parity:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check local action copy parity with published v1
        run: scripts/check-action-parity.sh

  mutations:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      MUTANT_PACKAGES: "polyforge-core polyforge-toolrunner polyforge-mcp polyforge-cli polyforge-tui"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Compute diff base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"
          else
            BASE="${{ github.event.before }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="$(git rev-parse HEAD^ || true)"
            fi
            echo "BASE=$BASE" >> "$GITHUB_ENV"
          fi

      - name: Capture diff of Rust sources
        run: git diff "$BASE".. -- '*.rs' | tee git.diff

      - name: Scope mutant list to the diff
        run: |
          if git diff --name-only "$BASE".. -- '*.rs' | grep -Eq '(^|/)tests?/|(^|/)[^/]*test[^/]*\.rs$' ; then
            echo "test files changed; running un-scoped full-crate suite" >&2
            echo "RUN_SCOPE=full" >> "$GITHUB_ENV"
          else
            MUTANTS=$(cargo mutants --list --json --in-diff git.diff $(for p in $MUTANT_PACKAGES; do printf -- '-p %s ' "$p"; done) 2>/dev/null | python3 -c 'import json,sys; d=sys.stdin.read().strip(); print(len(json.loads(d)) if d else 0)')
            if [ "$MUTANTS" -eq 0 ]; then
              echo "no mutants in diff scope; skipping mutations job" >&2
              echo "RUN_SCOPE=skip" >> "$GITHUB_ENV"
            else
              echo "$MUTANTS mutants in diff scope" >&2
              echo "RUN_SCOPE=in-diff" >> "$GITHUB_ENV"
            fi
          fi

      - name: Run mutations (in-diff)
        if: env.RUN_SCOPE == 'in-diff'
        run: cargo mutants --no-shuffle -j4 -vV --in-diff git.diff $(for p in $MUTANT_PACKAGES; do printf -- '-p %s ' "$p"; done) --timeout=500 --build-timeout=500

      - name: Run mutations (full, test files changed)
        if: env.RUN_SCOPE == 'full'
        run: cargo mutants --no-shuffle -j4 -vV $(for p in $MUTANT_PACKAGES; do printf -- '-p %s ' "$p"; done) --timeout=500 --build-timeout=500

      - name: Skip mutations (no mutants in scope)
        if: env.RUN_SCOPE == 'skip'
        run: echo "nothing to mutate; job skipped"

  mutations-weekly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Run mutations (full, hard-fail on survivors)
        run: cargo mutants --in-place --no-shuffle --timeout=500 --build-timeout=500

      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants.out
          path: mutants.out

  anchoring:
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build CLI
        run: cargo build -p polyforge-cli

      - name: Compute ledger tail
        run: |
          TAIL=$(target/debug/polyforge-cli ledger tail)
          printf '%s\n' "$TAIL" > /tmp/tail.txt
          echo "TAIL=$TAIL" >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign ledger tail keylessly
        run: cosign sign-blob --yes --bundle "anchor-${{ github.run_id }}.bundle" /tmp/tail.txt

      - name: Attest ledger tail provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: polyforge-ledger-tail@${{ github.sha }}
          subject-digest: sha256:${{ env.TAIL }}

      - name: Upload anchor artifacts
        uses: actions/upload-artifact@v7
        with:
          name: anchor-${{ github.run_id }}
          path: |
            anchor-${{ github.run_id }}.bundle
            /tmp/tail.txt

  publish-anchor:
    needs: [ci, anchoring]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build polyforge-attest and polyforge-cli
        run: cargo build -p polyforge-attest -p polyforge-cli

      - name: Emit chain statement
        run: target/debug/polyforge-attest chain --ledger .pf/ledger.jsonl --out /tmp/chain-statement.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign chain statement keylessly (Rekor upload default-on)
        run: cosign sign-blob --yes --bundle /tmp/anchor-pub.bundle /tmp/chain-statement.json

      - name: Extract publication record from bundle
        run: |
          TAIL=$(target/debug/polyforge-cli ledger tail)
          BUNDLE_SHA=$(sha256sum /tmp/anchor-pub.bundle | cut -d' ' -f1)
          python3 - "$TAIL" "$BUNDLE_SHA" "${{ github.run_id }}" <<'EOF'
          import json
          import sys

          tail_hash, bundle_sha256, run_id = sys.argv[1], sys.argv[2], sys.argv[3]
          with open("/tmp/anchor-pub.bundle") as f:
              bundle = json.load(f)
          entry = bundle["verificationMaterial"]["tlogEntries"][0]
          record = {
              "tail_hash": tail_hash,
              "bundle_sha256": bundle_sha256,
              "rekor_index": entry["logIndex"],
              "run_id": run_id,
          }
          with open("anchor-publication.json", "w") as f:
              json.dump(record, f, indent=2)
              f.write("\n")
          EOF

      - name: Upload anchor publication artifact
        uses: actions/upload-artifact@v7
        with:
          name: anchor-publication
          path: |
            anchor-publication.json
            /tmp/anchor-pub.bundle