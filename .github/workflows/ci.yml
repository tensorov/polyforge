name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint (clippy, warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: PolyForge self-gate (read-only)
        run: |
          cargo build -p polyforge-cli
          ./target/debug/polyforge-cli ledger tail
          PF_EVIDENCE_DIR=/tmp/pf-ci-evidence ./target/debug/polyforge-cli gate bootstrap --required verified