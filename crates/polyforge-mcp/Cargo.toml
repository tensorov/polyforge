[package]
name = "polyforge-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MCP server exposing the PolyForge evidence ledger and completion gate over stdio (rmcp)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["mcp", "model-context", "server", "stdio", "ledger"]
categories = ["development-tools", "web-programming"]

[dependencies]
polyforge-core = { path = "../polyforge-core", version = "0.3.0" }
polyforge-toolrunner = { path = "../polyforge-toolrunner", version = "0.3.0" }
rmcp = { version = "3", features = ["transport-io", "client"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
anyhow = "1"
