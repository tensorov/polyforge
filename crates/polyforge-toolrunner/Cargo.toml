[package]
name = "polyforge-toolrunner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Allowlisted, typed-argument, no-shell command runner producing verified tool attestations"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["runner", "allowlist", "attestation", "sandbox", "cli"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "polyforge_toolrunner"
path = "src/lib.rs"

[features]
# Gate for the sandbox execution backend (T10 mock adapter). Empty until the
# backend lands; selecting ExecutorKind::Sandbox without it fails closed.
sandbox-mock = []
# Gate for the gVisor (runsc) execution backend (T7). Empty: std-only, no new
# deps. Without the feature the module is not compiled at all; with it, e2e
# tests skip cleanly when runsc is absent on the host.
sandbox-gvisor = []
# Gate for the real container backend (T6 docker/podman executor). Empty by
# default: no new dependencies, std::process::Command only. When compiled in,
# a probed Container tier routes ExecutorKind::Sandbox to ContainerExecutor.
sandbox-container = []
# Gate for the Firecracker microVM execution backend (T9). Empty: std-only
# plus serde_json/sha2 which are already unconditional deps. Live boots need
# /dev/kvm plus the firecracker/jailer binaries and provisioned assets; unit
# tests are hermetic (mocked-API only, no VM).
sandbox-firecracker = []

[dependencies]
polyforge-core = { path = "../polyforge-core", version = "0.4.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"