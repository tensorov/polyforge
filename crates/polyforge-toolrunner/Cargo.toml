[package]
name = "polyforge-toolrunner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Allowlisted, typed-argument, no-shell command runner producing verified tool attestations"
license.workspace = true
repository.workspace = true

[lib]
name = "polyforge_toolrunner"
path = "src/lib.rs"

[dependencies]
polyforge-core = { path = "../polyforge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"