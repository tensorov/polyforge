[package]
name = "polyforge-toolrunner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Allowlisted, typed-argument, no-shell command runner producing verified tool attestations"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["runner", "allowlist", "attestation", "sandbox", "cli"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "polyforge_toolrunner"
path = "src/lib.rs"

[features]
# Gate for the sandbox execution backend (T10 mock adapter). Empty until the
# backend lands; selecting ExecutorKind::Sandbox without it fails closed.
sandbox-mock = []

[dependencies]
polyforge-core = { path = "../polyforge-core", version = "0.3.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"