<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="cli-demo-title cli-demo-desc">
  <title id="cli-demo-title">PolyForge CLI demo</title>
  <desc id="cli-demo-desc">Terminal session running the PolyForge quick start: PF_LEDGER is exported, polyforge-cli init creates the ledger, append model_claim records a claim, append tool_attestation promotes it to Verified, and gate demo --required verified passes.</desc>

  <!-- Canvas board (outermost, radius 12 per tokens) -->
  <rect x="0" y="0" width="1200" height="420" rx="12" fill="#0a0a0a"/>

  <!-- ==================== Terminal window ==================== -->
  <g id="terminal-window">
    <rect x="200" y="48" width="800" height="340" rx="8" fill="#16130f" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Terminal chrome -->
    <g id="terminal-chrome">
      <g fill="#9B9690">
        <circle cx="220" cy="66" r="4"/>
        <circle cx="236" cy="66" r="4"/>
        <circle cx="252" cy="66" r="4"/>
      </g>
      <text id="terminal-title" x="272" y="72" font-family="ui-monospace, &quot;Cascadia Code&quot;, &quot;JetBrains Mono&quot;, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="16" fill="#9B9690">polyforge-cli</text>
      <line x1="200" y1="84" x2="1000" y2="84" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </g>

    <!-- Terminal body -->
    <g font-family="ui-monospace, &quot;Cascadia Code&quot;, &quot;JetBrains Mono&quot;, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="18">
      <text id="line-1" x="224" y="124" fill="#EDEBE0">$ export PF_LEDGER=/tmp/pf-demo/ledger.jsonl</text>
      <text id="line-2" x="224" y="151" fill="#EDEBE0">$ polyforge-cli init</text>
      <text id="line-3" x="224" y="178" fill="#9B9690">created ledger at /tmp/pf-demo/ledger.jsonl</text>
      <text id="line-4" x="224" y="205" fill="#EDEBE0">$ polyforge-cli append model_claim &quot;claim datum&quot; --task demo \</text>
      <text id="line-5" x="244" y="232" fill="#EDEBE0">--commit abc123 --diff d1</text>
      <text id="line-6" x="224" y="259" fill="#9B9690">appended entry 0</text>
      <text id="line-7" x="224" y="286" fill="#EDEBE0">$ polyforge-cli append tool_attestation &quot;ran&quot; --task demo</text>
      <text id="line-8" x="224" y="313" fill="#9B9690">appended entry 1</text>
      <text id="line-9" x="224" y="340" fill="#EDEBE0">$ polyforge-cli gate demo --required verified</text>
      <g id="pass-line">
        <text id="line-10" x="224" y="367" font-size="22" fill="#E8A75B">gate PASSED for task demo</text>
      </g>
    </g>
  </g>
</svg>
