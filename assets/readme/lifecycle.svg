<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="lifecycle-title lifecycle-desc">
  <title id="lifecycle-title">PolyForge evidence lifecycle</title>
  <desc id="lifecycle-desc">Stage-gate flow: a model appends a ModelClaimed entry, an allowlisted tool promotion (tool_attestation) reaches Verified, and an operator validation reaches Validated. Models can never self-produce Verified.</desc>

  <!-- Canvas board -->
  <rect x="0" y="0" width="1200" height="400" rx="12" fill="#0a0a0a"/>

  <!-- ============ State nodes (chain backbone) ============ -->
  <!-- ModelClaimed -->
  <rect x="48" y="140" width="228" height="72" rx="4" fill="#16130f" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Verified -->
  <rect x="486" y="140" width="228" height="72" rx="4" fill="#16130f" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Validated (current/latest node, ember accent) -->
  <rect x="924" y="140" width="228" height="72" rx="4" fill="#FF6A3D" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- ============ Connectors (1px hairline chain links) ============ -->
  <g fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <path d="M276 176 L478 176"/>
    <path d="M714 176 L916 176"/>
  </g>

  <!-- Arrowheads -->
  <g fill="#9B9690">
    <polygon points="479,171 486,176 479,181"/>
    <polygon points="917,171 924,176 917,181"/>
  </g>

  <!-- ============ State names ============ -->
  <g font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle">
    <text x="162" y="184" fill="#EDEBE0">ModelClaimed</text>
    <text x="600" y="184" fill="#E8A75B">Verified</text>
    <text x="1038" y="184" fill="#0a0a0a">Validated</text>
  </g>

  <!-- ============ Promotion paths ============ -->
  <g text-anchor="middle">
    <!-- tool_attestation: ModelClaimed -> Verified -->
    <text x="381" y="164" font-family="ui-monospace, &quot;Cascadia Code&quot;, &quot;JetBrains Mono&quot;, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="18" fill="#EDEBE0">tool_attestation</text>
    <!-- validation: Verified -> Validated -->
    <text x="819" y="164" font-family="ui-monospace, &quot;Cascadia Code&quot;, &quot;JetBrains Mono&quot;, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="18" fill="#EDEBE0">validation</text>
  </g>

  <!-- ============ ModelClaimed annotation ============ -->
  <g text-anchor="middle">
    <text x="162" y="244" font-family="ui-monospace, &quot;Cascadia Code&quot;, &quot;JetBrains Mono&quot;, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="18" fill="#EDEBE0">model_claim</text>
  </g>
</svg>
