[workspace]
resolver = "2"
members = [
    "crates/polyforge-core",
    "crates/polyforge-toolrunner",
    "crates/polyforge-mcp",
    "crates/polyforge-cli",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/tensorov/polyforge"
homepage = "https://github.com/tensorov/polyforge"